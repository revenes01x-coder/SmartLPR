server {
    listen 80;
    absolute_redirect off;

    # กฎข้อ 1: แจกไฟล์หน้าเว็บ HTML ปกติ (ไม่แคชเพื่อให้อัปเดตโค้ดหน้าบ้านใหม่เสมอ)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # กฎข้อ 2: แจกรูปภาพป้ายทะเบียนจากโฟลเดอร์ captures โดยตรง
    location /captures/ {
        alias /app/captures/;
    }

    # กฎข้อ 3: โอนสาย API ไปหา Python (FastAPI)
    location /api/ {
        # สังเกตว่ามีเครื่องหมาย / ต่อท้าย: มันจะช่วยลบคำว่า /api/ ออกก่อนส่งไปหา Python
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # กฎข้อพิเศษ: รองรับ Swagger UI และ OpenAPI โดยตรง ไม่ต้อง Redirect
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # รองรับ Auth API โดยตรง (เช่น OAuth2 Authorize ใน Swagger UI)
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # กฎข้อ 4: รองรับ Partner API โดยตรง (เช่น /partner/cameras ตามคู่มือ PDF)
    location /partner/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # กฎข้อ 5: รองรับ Webhook API โดยตรง (เช่น /webhook/add)
    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
