# [Upstream]: หา backend ผ่าน DNS ภายในของ Docker (127.0.0.11) แบบถามใหม่ทุก 10 วินาที
# เดิมเขียน proxy_pass ไปที่ backend:8000 ตรงๆ ซึ่ง nginx จะถามที่อยู่ backend "ครั้งเดียวตอนเปิด" แล้วจำไว้ตลอด
# พอแยกเป็น 3 โปรเจค (คนละ docker compose) จะเจอ 2 ปัญหา:
#   1) เปิด frontend ก่อน backend -> nginx หาชื่อ backend ไม่เจอ -> nginx ล่มทันที
#   2) backend ถูกสร้างใหม่ (IP เปลี่ยน) -> nginx ยังยิงไป IP เก่า -> 502 จนกว่าจะ restart frontend
# "resolve" ทำให้ nginx เปิดได้แม้ backend ยังไม่มา และตามหา IP ใหม่ของ backend เอง (ต้องใช้ nginx 1.27.3+)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream smartlpr_backend {
    zone smartlpr_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    absolute_redirect off;

    # [Security]: ทุก location ตั้ง X-Forwarded-For เป็น $remote_addr (IP ที่ต่อเข้ามาหา nginx จริง)
    # "เขียนทับ" ค่าที่ client ส่งมาเสมอ — ห้ามใช้ $proxy_add_x_forwarded_for เพราะจะต่อท้ายค่าที่
    # client ปลอมมาได้ แล้ว backend จะเชื่อ IP ปลอมนั้น (rate limit / login lockout ถูกเลี่ยงได้)
    # (กฎ "เขียนทับ" นี้ใช้กับ nginx ตัวนี้ ซึ่งเป็นด่านสุดท้ายก่อน backend เท่านั้น — $remote_addr ตรงนี้
    # ผ่าน realip ด้านล่างมาแล้ว จึงเป็น IP ผู้ใช้จริง ส่วน proxy ตัวกลาง เช่น nginx ของเพื่อน ต้องใช้แบบต่อท้าย
    # $proxy_add_x_forwarded_for ไม่งั้น IP จริงจะหายก่อนมาถึงเรา)

    # [Real IP]: ทางที่ request วิ่งจริงบน VM
    #   ผู้ใช้ -> 192.168.100.44 (proxy HTTPS ของบริษัท) -> nginx ของเพื่อน (village_guard_nginx)
    #   -> nginx ตัวนี้ (เห็น connection มาจาก 172.20.0.1 = gateway ของ network smartlpr_web)
    # header ที่มาถึง: X-Forwarded-For: <IP ผู้ใช้จริง>, 192.168.100.44
    # real_ip_recursive on = อ่านจากขวาไปซ้าย ข้าม IP ที่อยู่ใน set_real_ip_from แล้วหยิบตัวแรกที่ไม่อยู่
    # = IP ผู้ใช้จริง -> กลายเป็น $remote_addr แล้วส่งต่อให้ backend ใช้ทำ rate limit
    # ในเครื่อง (ngrok): ngrok ใส่ X-Forwarded-For: <IP ผู้ใช้จริง> มาให้ ใช้ config ชุดเดียวกันได้
    # 172.20.0.1 ถูกล็อกไว้ใน scripts/setup-networks.sh (subnet ของ smartlpr_web) ถ้าเปลี่ยนต้องแก้ทั้งสองที่
    # (ดูได้จากช่องแรกของ: docker logs smartlpr-frontend --tail 5)
    set_real_ip_from 172.20.0.1;
    set_real_ip_from 192.168.100.44;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # กฎข้อ 1: แจกไฟล์หน้าเว็บ HTML ปกติ (ไม่แคชเพื่อให้อัปเดตโค้ดหน้าบ้านใหม่เสมอ)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # [PDPA/Security]: เดิมมี location /captures/ แจกรูปป้ายทะเบียนตรงจากดิสก์โดยไม่ต้อง login
    # (ชื่อไฟล์เดาได้: camera_{id}/full/{วันเวลา}_{ทะเบียน}_{จังหวัด}_full.jpg) และหน้าเว็บไม่ได้ใช้
    # path นี้เลย จึงลบทิ้ง — รูปส่งถึงลูกค้าผ่าน webhook เท่านั้น

    # [Security]: /capture-event มีไว้ให้ camera ยิงเข้า backend ทาง network ภายในเท่านั้น
    # (camera ยิงตรงไปที่ backend:8000 ไม่ผ่าน nginx) — ปิดไม่ให้คนนอกยิงผ่าน /api/capture-event
    # (เดิมกันด้วย secret อย่างเดียว) ^~ ที่ยาวกว่า /api/ จะถูกเลือกก่อนเสมอ
    location ^~ /api/capture-event {
        return 404;
    }

    # กฎข้อ 3: โอนสาย API ไปหา Python (FastAPI)
    location /api/ {
        # สังเกตว่ามีเครื่องหมาย / ต่อท้าย: มันจะช่วยลบคำว่า /api/ ออกก่อนส่งไปหา Python
        proxy_pass http://smartlpr_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # กฎข้อพิเศษ: รองรับ Swagger UI และ OpenAPI โดยตรง ไม่ต้อง Redirect
    location /docs {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /redoc {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /openapi.json {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # รองรับ Auth API โดยตรง (เช่น OAuth2 Authorize ใน Swagger UI)
    location /auth/ {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # กฎข้อ 4: รองรับ Partner API โดยตรง (เช่น /partner/cameras ตามคู่มือ PDF)
    location /partner/ {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # กฎข้อ 5: รองรับ Webhook API โดยตรง (เช่น /webhook/add)
    location /webhook/ {
        proxy_pass http://smartlpr_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
