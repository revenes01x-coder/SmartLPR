# ============================================================
# ไฟล์รวม (ใช้บน VM): รวม 3 โปรเจคเป็นคำสั่งเดียว ได้ 4 service คือ db, backend, camera, frontend
#
#   sh scripts/setup-networks.sh    # ครั้งแรกครั้งเดียว (deploy.yml เรียกให้ทุกครั้ง รันซ้ำได้)
#   docker compose up -d --build
#
# ค่าตั้งจริงของแต่ละ service อยู่ในโฟลเดอร์ของมันเอง — ไฟล์นี้แค่ include เข้ามา
# แก้ที่ backend/ camera/ frontend/ ที่เดียว ทั้งในเครื่องและบน VM ได้ค่าเดียวกัน
#
# ข้อควรระวัง: ในเครื่องเดียวกัน ให้เลือกใช้ "ไฟล์นี้" หรือ "3 ไฟล์แยก" อย่างใดอย่างหนึ่ง
# (ชื่อ container ซ้ำกัน) — ถ้าจะสลับ ให้ docker compose down ชุดเดิมก่อน
# ============================================================
name: smartlpr

include:
  - backend/docker-compose.yml
  - camera/docker-compose.yml
  - frontend/docker-compose.yml
